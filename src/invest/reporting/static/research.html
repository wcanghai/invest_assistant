<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能研究中心</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/nav-layout.css"><link rel="stylesheet" href="/research.css"></head><body>
<header><div class="brand"><span class="mark">研</span><div><strong>智能研究中心</strong><small>本地事实 · 官方证据 · 可追溯分析</small></div></div><div class="actions" id="site-navigation"><a href="/">市场日报</a><a href="/recommendations">股票推荐</a><a href="/etf-recommendations">ETF 推荐</a><a href="/rankings">股票排行榜</a><a href="/securities">证券查询</a><a href="/research" class="active" aria-current="page">研究中心</a></div></header>
<main class="research"><section class="research-hero"><p class="eyebrow">RESEARCH CENTER · 基础量化原型</p><h1>股票与 ETF 研究</h1><p>本地确定性数据优先，缺失字段不会补零或猜测；外部事件和 AI 分尚未生成时会明确降级显示。</p>
<div class="modes"><button class="mode active" data-mode="security">单股/ETF</button><button class="mode" data-mode="industry">行业/主题</button><button class="mode" data-mode="screen">条件筛选</button><button class="mode" data-mode="compare">多标的比较</button></div>
<div class="query" id="security-query"><select id="kind"><option value="stock">股票</option><option value="etf">ETF</option></select><div class="searchbox"><input id="code" autocomplete="off" placeholder="输入代码或名称，如 贵州茅台、510300"><div id="suggestions" class="suggestions"></div></div><button id="run">开始分析</button></div>
<div class="query" id="industry-query" hidden><input id="industry" placeholder="输入行业名称，如 半导体、银行"><button id="industry-run">分析行业</button></div>
<div class="query" id="screen-query" hidden><input id="screen-text" placeholder="例如：ROE≥10，PE≤30"><button id="screen-run">执行筛选</button></div>
<div class="query" id="compare-query" hidden><input id="compare-codes" placeholder="输入代码，逗号分隔，如 000001,600519,510300"><button id="compare-run">开始比较</button></div>
<p id="status" role="status"></p><div id="analysis-log" class="analysis-log" hidden aria-live="polite"></div></section>
<section id="result" hidden><div class="result-head"><div><span id="security"></span><h2 id="grade"></h2></div><div class="score"><b id="quant"></b><small>量化分</small></div></div><div class="state" id="state"></div><div class="grid"><article><h3>核心事实</h3><div id="facts"></div></article><article><h3>分项评分</h3><div id="dimensions"></div></article></div><article><h3>事件与证据</h3><div id="events"></div></article><article class="warnings"><h3>数据状态与风险</h3><ul id="warnings"></ul></article></section></main><script src="/research.js" defer></script></body></html>
