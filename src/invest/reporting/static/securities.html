<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>证券查询</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/securities.css"></head><body>
<header><div class="brand"><span class="mark">查</span><div><strong>证券查询</strong><small>股票与 ETF 数据浏览</small></div></div><div class="actions"><a href="/recommendations">股票推荐</a><a href="/rankings">股票排行榜</a><a href="/">返回每日市场观察</a></div></header>
<main><div class="heading"><div><p class="eyebrow">SECURITY EXPLORER</p><h1>股票与 ETF 查询</h1><p id="message">输入代码或名称开始查询</p></div></div>
<section class="search-panel"><label for="search">代码或名称</label><input id="search" autocomplete="off" placeholder="例如 600519.SH、贵州茅台、510300.SH"><div id="suggestions" class="suggestions"></div></section>
<div id="detail" hidden><section><div class="section-title"><h2 id="security-title"></h2><span id="security-meta"></span></div><div id="field-groups" class="field-groups"></div></section><section><div class="section-title"><h2 id="chart-title">日 K 走势</h2><span id="bar-count"></span></div><div class="date-form"><label>开始日期 <input id="start" type="date"></label><label>结束日期 <input id="end" type="date"></label><label>周期 <select id="period"><option value="day">日 K</option><option value="week">周 K</option><option value="month">月 K</option><option value="quarter">季 K</option><option value="year">年 K</option></select></label><button id="load-bars">查询行情</button></div><div id="chart-wrap"><canvas id="chart" height="360"></canvas></div><div id="chart-tip" class="chart-tip">将鼠标移到 K 线上查看对应数据</div></section></div><div id="empty">请选择一只股票或 ETF。</div></main><footer>本地只读数据 · 数据日期以数据库记录为准</footer><script src="/securities.js?v=3" defer></script></body></html>
