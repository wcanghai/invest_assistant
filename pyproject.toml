[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invest"
version = "0.1.0"
description = "本地量化研究、市场数据与投资日报平台"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "matplotlib>=3.9,<4",
  "playwright==1.62.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
invest = "invest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
